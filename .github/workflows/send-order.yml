name: Send Phoenix Order

# Triggered on-demand by the order form (repository_dispatch),
# the same GitHub Actions engine used for the Homeland vet checks.
on:
  repository_dispatch:
    types: [send_order]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Twilio
        run: pip install twilio
      - name: Send the order to Johnny (always English)
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:  ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM:        ${{ secrets.TWILIO_FROM }}
          ORDER_TO:           ${{ secrets.ORDER_TO }}
          ORDER_MESSAGE:      ${{ github.event.client_payload.message }}
        run: python send_order.py
